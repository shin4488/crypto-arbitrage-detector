# 本番相当の構成でローカル実行する: docker compose up --build
# 画面: http://localhost:8080
services:
  app:
    build: .
    image: crypto-arbitrage-detector:local
    container_name: crypto-arbitrage-detector
    ports:
      - "8080:8080"
    environment:
      # 設定ファイルを使う場合は volumes でマウントして ARB_CONFIG にパスを指定する
      # - ARB_CONFIG=/config.json
      - ARB_LOG_FORMAT=json
      - ARB_LOG_LEVEL=info
    # volumes:
    #   - ./config.json:/config.json:ro
    restart: unless-stopped
    # 実行時の権限を最小にする（読み取り専用ファイルシステム、権限昇格の禁止、ケーパビリティ全削除）
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
