# 依存の更新提案。cooldown で公開直後のバージョンを避け、乗っ取り等で公開された悪意あるバージョンが
# 取り下げられるまでの期間をやり過ごす。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Node の型定義は動かしている Node のメジャーに合わせて手動で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node は LTS に合わせて手動で上げる（25 以降は corepack が同梱されず、そのままでは動かない）
      - dependency-name: node
        update-types: ["version-update:semver-major"]
