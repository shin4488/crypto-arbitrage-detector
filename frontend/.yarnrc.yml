# サプライチェーン対策を中心にした Yarn (Berry) の設定
nodeLinker: node-modules

# 依存パッケージのインストール時スクリプト（postinstall 等）を禁止する。
# 悪意あるパッケージがコードを実行する主な経路を塞ぐ。ネイティブバイナリは optionalDependencies で配布されるものだけを使う。
enableScripts: false

# 公開から一定時間経っていないバージョンはインストールしない。
# アカウント乗っ取り等で公開された悪意あるバージョンは数時間〜数日で取り下げられることが多いため、その期間を避ける。
npmMinimalAgeGate: 7d

# バージョンは完全固定で保存する（^ や ~ を付けない）
defaultSemverRangePrefix: ""

enableTelemetry: false
