<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Binance と OKX の板をリアルタイムに比較し、手数料込みで利益が出る裁定機会を検知します" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Crypto Arbitrage Detector</title>
    <!-- 保存した配色を描画前に反映し、OS の設定と違うときに一瞬別の配色が出るのを防ぐ（useStoredTheme と同じキー） -->
    <script>
      try {
        const theme = localStorage.getItem('arb.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
