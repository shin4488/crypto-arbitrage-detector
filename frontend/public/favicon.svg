<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 安い取引所で買い（青）、高い取引所で売る（橙）。その段差（緑）が利益。画面の色使いと同じ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M14 45H31" stroke="#93c5fd"/>
    <path d="M31 45V19" stroke="#22c55e"/>
    <path d="M31 19H50" stroke="#fdba74"/>
  </g>
  <circle cx="14" cy="45" r="6.5" fill="#3b82f6"/>
  <circle cx="50" cy="19" r="6.5" fill="#f97316"/>
</svg>
